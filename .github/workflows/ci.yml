name: ci
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.27.x
          - 1.26.x
        os:
          - macos
          - ubuntu
          - windows

    name: build (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - run: make build

  test:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.27.x
          - 1.26.x
        os:
          - macos
          - ubuntu
          - windows

    name: test (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    # The e2e suite can also run against a real MinIO. Only Linux runners
    # have Docker, so the other systems use the in-process fake only.
    - name: Start MinIO
      if: matrix.os == 'ubuntu'
      run: |
        docker run -d --name minio -p 45677:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          quay.io/minio/minio:RELEASE.2023-07-18T17-49-40Z server /data
        for _ in $(seq 30); do
          curl -sf http://localhost:45677/minio/health/live && exit 0
          sleep 2
        done
        docker logs minio
        exit 1

    - run: make test
      env:
        S5CMD_TEST_ENDPOINT_URL: ${{ (matrix.os == 'ubuntu') && 'http://localhost:45677' || '' }}

  qa:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.27.x
          - 1.26.x
        os:
          - ubuntu

    name: qa (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - run: make bootstrap
    - run: make check
